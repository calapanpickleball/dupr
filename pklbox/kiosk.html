<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check in · DUPR Engine v.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#3a7d1e; --green-2:#2f6a17; --green-soft:rgba(58,125,30,.12);
    --charcoal:#2f332e; --charcoal-deep:#222622;
    --bg:#ececec; --surface:#ffffff; --surface-2:#f5f5f3; --text:#262a26; --muted:#6a706a; --border:#dcdddb;
    --red:#bb1421; --orange:#ff6600;
    --shadow:0 10px 30px rgba(38,42,38,.10); --radius:18px;
  }
  html[data-theme="dark"]{
    --green:#6cc144; --green-2:#58aa33; --green-soft:rgba(108,193,68,.16);
    --bg:#141714; --surface:#1e231e; --surface-2:#191d19; --text:#eef1ec; --muted:#9aa49a; --border:#2f372f;
    --shadow:0 10px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;
    padding-bottom:env(safe-area-inset-bottom,0px);}
  header.top{background:linear-gradient(135deg,var(--charcoal) 0%,var(--charcoal-deep) 100%);color:#fff;
    padding:calc(12px + env(safe-area-inset-top,0px)) clamp(14px,3vw,32px) 12px;display:flex;align-items:center;gap:clamp(10px,2vw,22px);
    border-bottom:4px solid var(--green);}
  header.top .logo{height:clamp(46px,8vw,76px);width:clamp(46px,8vw,76px);border-radius:12px;flex-shrink:0;background:#fff;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.4);}
  header.top .titles{flex:1;min-width:0;text-align:center;}
  header.top h1{margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(22px,4.2vw,40px);line-height:1.05;letter-spacing:.01em;}
  header.top .sub{margin-top:2px;font-size:clamp(12px,1.9vw,16px);color:#c3cdc3;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .theme-btn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:20px;cursor:pointer;box-shadow:var(--shadow);z-index:5;}
  main{max-width:960px;margin:0 auto;padding:clamp(14px,3vw,30px);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(16px,3vw,30px);}
  .step{margin-bottom:clamp(20px,3.4vw,30px);}
  .step-title{display:flex;align-items:center;gap:12px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:clamp(19px,3vw,26px);margin:0 0 12px;line-height:1.15;}
  .step-title .num{flex-shrink:0;width:clamp(30px,4.6vw,38px);height:clamp(30px,4.6vw,38px);border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,2.6vw,20px);}
  .bucket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;}
  .choice{position:relative;min-height:68px;padding:12px 16px;border-radius:14px;border:2px solid var(--border);background:var(--surface-2);color:var(--text);
    font:inherit;font-weight:700;font-size:clamp(17px,2.4vw,21px);cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:.12s;}
  .choice small{font-weight:500;font-size:13px;color:var(--muted);}
  .choice:active{transform:scale(.985);}
  .choice.selected{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 3px var(--green-soft);}
  .choice.selected::after{content:'✓';position:absolute;top:8px;right:12px;color:var(--green);font-size:20px;font-weight:800;}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .seg .choice{align-items:center;text-align:center;}
  .empty-note{padding:20px;border:2px dashed var(--border);border-radius:14px;color:var(--muted);text-align:center;font-weight:600;}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .field input{width:100%;height:58px;border-radius:14px;border:2px solid var(--border);background:var(--surface-2);color:var(--text);
    padding:0 16px;font:inherit;font-size:20px;font-weight:600;outline:none;}
  .field input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  .field input:disabled{opacity:.55;}
  .combo{position:relative;}
  .results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:2px solid var(--green);border-radius:14px;box-shadow:var(--shadow);
    z-index:20;max-height:min(320px,42vh);overflow:auto;display:none;}
  .results.show{display:block;}
  .results .item{padding:15px 18px;font-size:19px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--border);}
  .results .item:last-child{border-bottom:none;}
  .results .item:active,.results .item:hover{background:var(--green-soft);}
  .results .none{padding:15px 18px;color:var(--muted);font-weight:600;}
  .linkbtn{background:none;border:none;color:var(--green);font:inherit;font-weight:700;font-size:15px;padding:8px 0 0;cursor:pointer;text-decoration:underline;text-align:left;}
  .hint{font-size:13px;color:var(--muted);margin-top:2px;}
  .error{min-height:22px;margin:4px 0 12px;color:var(--red);font-weight:700;font-size:15px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;}
  .btn{height:64px;border-radius:16px;border:2px solid transparent;font:inherit;font-weight:800;font-size:clamp(18px,2.6vw,22px);cursor:pointer;padding:0 28px;}
  .btn-primary{flex:1;min-width:220px;background:var(--green);color:#fff;box-shadow:0 6px 16px var(--green-soft);}
  .btn-primary:disabled{opacity:.6;cursor:wait;}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--muted);}
  /* welcome popup */
  .overlay{position:fixed;inset:0;background:rgba(20,24,20,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .welcome{background:var(--surface);border-radius:28px;border:3px solid var(--green);box-shadow:0 20px 60px rgba(0,0,0,.5);padding:clamp(24px,5vw,50px);
    text-align:center;max-width:720px;width:100%;animation:pop .28s ease-out;overflow:hidden;position:relative;}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .welcome .tick{width:clamp(70px,12vw,104px);height:clamp(70px,12vw,104px);border-radius:50%;background:var(--green);color:#fff;font-size:clamp(40px,7vw,62px);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:800;}
  .welcome h2{margin:0 0 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(28px,5.4vw,46px);line-height:1.1;color:var(--text);}
  .welcome .who{font-size:clamp(19px,3vw,26px);font-weight:700;color:var(--green);margin-bottom:4px;}
  .welcome .cat{font-size:clamp(14px,2vw,17px);color:var(--muted);font-weight:600;margin-bottom:14px;}
  .welcome .luck{font-size:clamp(20px,3.2vw,28px);font-weight:700;margin-bottom:22px;}
  .welcome .bar{position:absolute;left:0;bottom:0;height:7px;background:var(--green);width:100%;transform-origin:left;animation:shrink 5s linear forwards;}
  @keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .welcome .btn{height:54px;font-size:19px;}
  @media (max-width:640px){ .fields{grid-template-columns:1fr;} header.top .sub{white-space:normal;} }
</style>
</head>

<main>
  <div class="card">
    <div class="step">
      <h2 class="step-title"><span class="num">1</span>Which category are you playing?</h2>
      <div class="bucket-grid" id="bucketGrid"></div>
    </div>

    <div class="step">
      <h2 class="step-title"><span class="num">2</span>Are you a member of CCPC?</h2>
      <div class="seg">
        <button type="button" class="choice" id="btnYes">Yes</button>
        <button type="button" class="choice" id="btnNo">No</button>
      </div>
    </div>

    <div class="step">
      <h2 class="step-title"><span class="num">3</span>Your details</h2>
      <div class="fields">
        <div class="field full combo">
          <label for="fName" id="lblName">Name</label>
          <input type="text" id="fName" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Choose Yes or No above first">
          <div class="results" id="results"></div>
          <button type="button" class="linkbtn" id="btnNotListed" style="display:none;">Can't find your name? Continue as non-member</button>
          <div class="hint" id="nameHint" style="display:none;">Start typing your name, then tap it in the list.</div>
        </div>
        <div class="field">
          <label for="fDuprId">DUPR ID</label>
          <input type="text" id="fDuprId" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. ABC1234">
        </div>
        <div class="field">
          <label for="fRating">Current DUPR rating</label>
          <input type="text" id="fRating" inputmode="decimal" autocomplete="off" placeholder="e.g. 3.250 or NR">
          <div class="hint">2.000 – 6.000, or NR if not rated yet.</div>
        </div>
      </div>
    </div>

    <div class="error" id="err"></div>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="btnSubmit">Submit</button>
      <button type="button" class="btn btn-ghost" id="btnReset">Start over</button>
    </div>
  </div>
</main>

<button class="theme-btn" id="themeBtn" title="Light / dark mode">🌙</button>

<div class="overlay" id="welcomeOverlay">
  <div class="welcome">
    <div class="tick">✓</div>
    <h2 id="wTitle">Welcome!</h2>
    <div class="who" id="wWho"></div>
    <div class="cat" id="wCat"></div>
    <div class="luck">Goodluck and Enjoy your game!</div>
    <button type="button" class="btn btn-ghost" id="btnWelcomeOk">OK</button>
    <div class="bar"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* DUPR Engine v.1 data lives in the pklbox project */
const firebaseConfig = {
  apiKey: "AIzaSyDhWLbY2QERNuOn7R-g8VljB4VTKW9RgEs",
  authDomain: "pklbox-e01b3.firebaseapp.com",
  projectId: "pklbox-e01b3",
  storageBucket: "pklbox-e01b3.firebasestorage.app",
  messagingSenderId: "197030960226",
  appId: "1:197030960226:web:529888c44967b2c30d853b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* CCPC Members Database: original Firebase project (collection ccpc-dupr) */
const ccpcMembersConfig = {
  apiKey: "AIzaSyBv_s3wzr6nbFcqZbTI0UDdcijFWnO-t4I",
  authDomain: "ccpc-dupr.firebaseapp.com",
  databaseURL: "https://ccpc-dupr-default-rtdb.firebaseio.com",
  projectId: "ccpc-dupr",
  storageBucket: "ccpc-dupr.firebasestorage.app",
  messagingSenderId: "49883771837",
  appId: "1:49883771837:web:ca4be96157a62afbc858d4",
  measurementId: "G-9D46L85X2T"
};
const dbMembers = firebase.initializeApp(ccpcMembersConfig, 'ccpc-members').firestore();
const MEMBERS_COL = 'ccpc-dupr';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function escapeHtml(str){ return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function parseDupr(raw){
  const v = (raw || '').trim();
  if (v.toUpperCase() === 'NR') return { ok:true, raw:'NR', value:3.0, db:'NR' };
  const num = parseFloat(v);
  if (isNaN(num) || !/^\d+(\.\d+)?$/.test(v) || num < 2 || num > 6) return { ok:false, error:'Enter NR or a rating from 2.000 to 6.000.' };
  const r = Math.round(num * 1000) / 1000;
  return { ok:true, raw:r.toFixed(3), value:r, db:r };
}
function duprNumeric(v){ return v === 'NR' ? 3.0 : Number(v); }
function fmtNum(n){ return (Math.round(n * 1000) / 1000).toFixed(3); }
function fmtDupr(v){ return v === 'NR' ? 'NR' : (v === undefined || v === null || v === '' ? '' : Number(v).toFixed(3)); }

/* ---------- theme ---------- */
const html = document.documentElement;
function applyTheme(t){ html.setAttribute('data-theme', t); $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙'; try { localStorage.setItem('pkl-kiosk-theme', t); } catch (e) {} }
let savedTheme = 'light'; try { savedTheme = localStorage.getItem('pkl-kiosk-theme') || 'light'; } catch (e) {}
applyTheme(savedTheme);
$('themeBtn').addEventListener('click', () => applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ---------- live data ---------- */
let BUCKETS = [], bucketsLoaded = false, sessionName = '', allMembers = [];
db.collection('pkl-queue-buckets').onSnapshot(snap => {
  BUCKETS = snap.docs.map(d => { const x = d.data(); return { key:d.id, label:x.name || 'Bucket', mode:x.mode === 'singles' ? 'singles' : 'doubles',
    order:(x.order !== undefined && x.order !== null) ? Number(x.order) : (x.createdAtMs || 0), createdAtMs:x.createdAtMs || 0 }; })
    .sort((a, b) => a.order - b.order || a.createdAtMs - b.createdAtMs);
  bucketsLoaded = true;
  if (state.bucket && !BUCKETS.some(b => b.key === state.bucket)) state.bucket = null;
  renderBuckets();
}, err => { $('bucketGrid').innerHTML = `<div class="empty-note">Could not load categories. ${escapeHtml(err.message)}</div>`; });
db.collection('pkl-queue-session').doc('state').onSnapshot(doc => {
  sessionName = (doc.exists && doc.data().currentSessionName) || '';
  $('sessionSub').textContent = sessionName ? sessionName : 'Welcome! Please check in below.';
}, () => {});
dbMembers.collection(MEMBERS_COL).onSnapshot(snap => {
  allMembers = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(m => m.name);
}, err => console.warn('Members database not available:', err.message));

/* ---------- form state ---------- */
const state = { bucket:null, mode:null, member:null };
function renderBuckets(){
  const g = $('bucketGrid');
  if (!bucketsLoaded) { g.innerHTML = `<div class="empty-note">Loading categories…</div>`; return; }
  if (!BUCKETS.length) { g.innerHTML = `<div class="empty-note">No categories yet. Please see the organizer.</div>`; return; }
  g.innerHTML = BUCKETS.map(b => `<button type="button" class="choice ${state.bucket === b.key ? 'selected' : ''}" data-key="${b.key}">${escapeHtml(b.label)}<small>${b.mode === 'singles' ? 'Singles' : 'Doubles'}</small></button>`).join('');
  g.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', () => { state.bucket = btn.dataset.key; renderBuckets(); clearError(); }));
}
function setMode(mode){
  const prev = state.mode;
  state.mode = mode;
  $('btnYes').classList.toggle('selected', mode === 'yes');
  $('btnNo').classList.toggle('selected', mode === 'no');
  const isYes = mode === 'yes';
  $('btnNotListed').style.display = isYes ? '' : 'none';
  $('nameHint').style.display = isYes ? '' : 'none';
  $('fName').placeholder = isYes ? 'Start typing your name…' : (mode === 'no' ? 'Your full name' : 'Choose Yes or No above first');
  $('fName').disabled = !mode;
  if (isYes) {
    if (prev !== 'yes') { state.member = null; $('fDuprId').value = ''; $('fRating').value = ''; }
    $('fDuprId').disabled = !state.member; $('fRating').disabled = !state.member;
    $('fDuprId').placeholder = 'Filled in when you pick your name'; $('fRating').placeholder = 'Filled in when you pick your name';
  } else {
    state.member = null; hideResults();
    $('fDuprId').disabled = !mode; $('fRating').disabled = !mode;
    $('fDuprId').placeholder = 'e.g. ABC1234'; $('fRating').placeholder = 'e.g. 3.250 or NR';
  }
  clearError();
  if (mode) $('fName').focus();
}
$('btnYes').addEventListener('click', () => setMode('yes'));
$('btnNo').addEventListener('click', () => setMode('no'));
$('btnNotListed').addEventListener('click', () => { setMode('no'); });

/* member search: names only in the list */
function hideResults(){ $('results').classList.remove('show'); $('results').innerHTML = ''; }
$('fName').addEventListener('input', () => {
  if (state.mode !== 'yes') return;
  if (state.member) { state.member = null; $('fDuprId').value = ''; $('fRating').value = ''; $('fDuprId').disabled = true; $('fRating').disabled = true; }
  const q = $('fName').value.trim().toLowerCase();
  if (q.length < 1) { hideResults(); return; }
  const matches = allMembers.filter(m => m.name.toLowerCase().includes(q)).sort((a, b) => {
    const as = a.name.toLowerCase().startsWith(q) ? 0 : 1, bs = b.name.toLowerCase().startsWith(q) ? 0 : 1;
    return as - bs || a.name.localeCompare(b.name);
  }).slice(0, 8);
  const r = $('results');
  r.innerHTML = matches.length ? matches.map(m => `<div class="item" data-id="${m.id}">${escapeHtml(m.name)}</div>`).join('')
    : `<div class="none">No member found. You can continue as a non-member below.</div>`;
  r.classList.add('show');
  r.querySelectorAll('.item').forEach(el => el.addEventListener('pointerdown', e => { e.preventDefault(); pickMember(el.dataset.id); }));
});
function pickMember(id){
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  state.member = m;
  $('fName').value = m.name;
  $('fDuprId').value = m.duprId || '';
  $('fRating').value = fmtDupr(m.curDupr);
  $('fDuprId').disabled = false; $('fRating').disabled = false;
  hideResults(); clearError();
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.combo')) hideResults(); });

/* ---------- submit ---------- */
function showError(msg){ $('err').textContent = msg; }
function clearError(){ $('err').textContent = ''; }
let submitting = false;
$('btnSubmit').addEventListener('click', async () => {
  if (submitting) return;
  clearError();
  const bucket = BUCKETS.find(b => b.key === state.bucket);
  if (!BUCKETS.length) { showError('No categories yet. Please see the organizer.'); return; }
  if (!bucket) { showError('Step 1: please pick the category you are playing.'); return; }
  if (!state.mode) { showError('Step 2: please tell us if you are a CCPC member.'); return; }
  const name = $('fName').value.trim().replace(/\s+/g, ' ');
  const duprId = $('fDuprId').value.trim();
  if (state.mode === 'yes' && !state.member) { showError('Please tap your name in the list, or choose "No" if you are not a member.'); return; }
  if (!name) { showError('Please enter your name.'); return; }
  if (!duprId) { showError('Please enter your DUPR ID.'); return; }
  const cur = parseDupr($('fRating').value);
  if (!cur.ok) { showError(cur.error); return; }

  submitting = true;
  const btn = $('btnSubmit'); btn.disabled = true; btn.textContent = 'Checking you in…';
  try {
    const m = state.member;
    let dupr = cur.value, duprRaw = cur.raw;
    let memberUpdate = null;
    if (state.mode === 'yes' && m) {
      const ath = m.athDupr === undefined || m.athDupr === null || m.athDupr === '' ? 'NR' : m.athDupr;
      const club = Math.round(((duprNumeric(ath) + duprNumeric(cur.db)) / 2) * 1000) / 1000;
      dupr = club; duprRaw = fmtNum(club);
      const changed = (m.duprId || '') !== duprId || String(m.curDupr) !== String(cur.db);
      if (changed) memberUpdate = { duprId, curDupr: cur.db, clubDupr: club, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    }
    await db.collection('pkl-queue-participants').add({
      bucket: bucket.key,
      sourceType: state.mode === 'yes' ? 'member' : 'guest',
      memberId: state.mode === 'yes' && m ? m.id : null,
      name, duprId, dupr, duprRaw,
      status: 'active', statusSince: Date.now(), sitOutStreak: 0,
      viaKiosk: true,
      joinedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    if (memberUpdate) {
      try { await dbMembers.collection(MEMBERS_COL).doc(m.id).update(memberUpdate); }
      catch (e) { console.warn('Could not update the CCPC Members Database:', e.message); }
    }
    showWelcome(name, bucket);
  } catch (err) {
    showError('Sorry, check-in did not go through. Please try again or see the organizer. (' + err.message + ')');
  } finally {
    submitting = false; btn.disabled = false; btn.textContent = 'Submit';
  }
});

/* ---------- welcome popup, back to the form after 5 seconds ---------- */
let welcomeTimer = null;
function showWelcome(name, bucket){
  $('wTitle').textContent = sessionName ? `Welcome to ${sessionName}!` : 'Welcome!';
  $('wWho').textContent = name;
  $('wCat').textContent = `${bucket.label} · ${bucket.mode === 'singles' ? 'Singles' : 'Doubles'}`;
  const ov = $('welcomeOverlay');
  const bar = ov.querySelector('.bar');
  bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
  ov.classList.add('show');
  clearTimeout(welcomeTimer);
  welcomeTimer = setTimeout(closeWelcome, 5000);
}
function closeWelcome(){
  clearTimeout(welcomeTimer);
  $('welcomeOverlay').classList.remove('show');
  resetForm();
}
$('btnWelcomeOk').addEventListener('click', closeWelcome);

/* ---------- reset: Start over + 60 s idle ---------- */
function resetForm(){
  state.bucket = null; state.member = null; state.mode = null;
  ['fName','fDuprId','fRating'].forEach(id => { $(id).value = ''; });
  setMode(null);
  $('fName').blur();
  hideResults(); clearError(); renderBuckets();
  window.scrollTo({ top:0 });
}
$('btnReset').addEventListener('click', resetForm);
let idleTimer = null;
function formDirty(){ return !!(state.bucket || state.mode || $('fName').value || $('fDuprId').value || $('fRating').value); }
function bumpIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!$('welcomeOverlay').classList.contains('show') && formDirty() && !submitting) resetForm(); }, 60000);
}
['pointerdown','keydown','input','touchstart'].forEach(ev => document.addEventListener(ev, bumpIdle, { passive:true }));
bumpIdle();

setMode(null);
renderBuckets();
</script>
