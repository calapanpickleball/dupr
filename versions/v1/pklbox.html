<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKL Box - Own The Dink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Default: close to the supplied PKL Box logo colors */
    --primary:#3e7726;
    --primary-deep:#2f571d;
    --accent:#3f3f3f;
    --accent-soft:#6a6a6a;
    --info:#4d8f37;
    --warning:#c87924;
    --danger:#a63a3a;
    --success:#3f9a5f;
    --bg:#eef1ec;
    --surface:#ffffff;
    --surface-2:#f5f7f3;
    --text:#252925;
    --muted:#667066;
    --border:#d7ded2;
    --shadow:0 10px 30px rgba(45,70,40,.18);
  }

  /* Light pink */
  html[data-theme="pink-light"]{
    --primary:#d45d86;
    --primary-deep:#a83e64;
    --accent:#8d3155;
    --accent-soft:#bd6382;
    --info:#c45178;
    --warning:#d47a52;
    --danger:#b8445e;
    --success:#4d9b73;
    --bg:#fff1f5;
    --surface:#ffffff;
    --surface-2:#fff8fa;
    --text:#492431;
    --muted:#8a6572;
    --border:#efd5de;
    --shadow:0 10px 30px rgba(141,49,85,.14);
  }

  /* Dark pink */
  html[data-theme="pink-dark"]{
    --primary:#e26796;
    --primary-deep:#8f3158;
    --accent:#ff9fc1;
    --accent-soft:#d9789d;
    --info:#d85a8b;
    --warning:#df8a65;
    --danger:#e15c70;
    --success:#68b88b;
    --bg:#26101a;
    --surface:#351724;
    --surface-2:#401c2b;
    --text:#fff1f6;
    --muted:#d3a9b9;
    --border:#623044;
    --shadow:0 12px 34px rgba(0,0,0,.38);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  h1,h2,h3,.headline{font-family:'Baloo 2',system-ui,sans-serif;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:2vw;
    padding:0 2vw;height:11vh;flex-shrink:0;
    background:linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
    box-shadow:var(--shadow);position:relative;z-index:5;
  }
  header.top .brand{display:flex;align-items:center;}
  .logo-slot{
    height:8.2vh;min-width:12vh;padding:0 1.2vw;
    border:2px dashed rgba(255,255,255,.55);border-radius:1vh;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.82);font-size:min(1.7vh,1vw);
    font-weight:800;letter-spacing:.08em;text-align:center;
    background:rgba(255,255,255,.06);
  }
  header.top .brand.right.logo-slot{height:8.2vh;}

  header.top .logo-slot{height:8.2vh;min-width:12vh;padding:0;border:none;background:transparent;}
  header.top .logo-slot img{height:8.2vh;width:auto;max-width:18vw;object-fit:contain;border-radius:1vh;display:block;}
  header.top .brand.right.logo-slot img{height:8.2vh;max-width:18vw;}
  header.top .brand img{height:8.6vh;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  header.top h1{margin:0;color:#fff;font-size:min(4.8vh,2.7vw);font-weight:800;text-align:center;letter-spacing:.3px;}
  header.top .brand.right img{height:8.2vh;border-radius:1vh;}
  .theme-picker{
    position:absolute;top:8px;right:8px;
    display:flex;align-items:center;gap:5px;
    padding:4px 6px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.28);border-radius:999px;
    z-index:10;backdrop-filter:blur(6px);
  }
  .theme-btn{
    width:18px;height:18px;border-radius:50%;
    border:2px solid rgba(255,255,255,.55);
    cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25);
    transition:transform .15s ease, border-color .15s ease;
  }
  .theme-btn:hover{transform:scale(1.12);}
  .theme-btn.active{border-color:#fff;transform:scale(1.14);}
  .theme-btn.logo{background:#3e7726;}
  .theme-btn.pink-light{background:#d45d86;}
  .theme-btn.pink-dark{background:#5a2038;}

  main{flex:1;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:1.2vw;padding:1.6vh 1.2vw;overflow:hidden;min-height:0;}
  .col{display:grid;grid-template-rows:1fr 1fr;gap:1.6vh;min-height:0;min-width:0;}

  .court-card{
    background:var(--surface);border:.45vh solid var(--border);border-radius:2vh;
    padding:1.6vh 1.5vw;box-shadow:var(--shadow);display:flex;flex-direction:column;
    justify-content:space-between;min-height:0;min-width:0;overflow:hidden;
  }
  .court-card.playing{border-color:var(--warning);}
  .court-card.assigned{border-color:var(--info);}
  .court-num{
    font-family:'Baloo 2';font-weight:800;font-size:min(4vh,2.2vw);color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;justify-content:space-between;line-height:1;
  }
  .court-status-pill{font-size:min(2.3vh,1.25vw);font-weight:800;padding:.6vh 1vw;border-radius:5vh;color:#fff;letter-spacing:0;}
  .court-status-pill.free{background:var(--success);}
  .court-status-pill.playing{background:var(--warning);}
  .court-status-pill.assigned{background:var(--info);}
  .players{display:flex;flex-direction:column;min-width:0;}
  .players .p{font-family:'Baloo 2';font-weight:800;font-size:min(4.6vh,2.7vw);line-height:1.1;white-space:nowrap;overflow:hidden;}
  .players .vs{color:var(--accent);font-family:'Baloo 2';font-weight:800;font-size:min(2.6vh,1.5vw);margin:.5vh 0;letter-spacing:.2em;}
  .court-card .timer{font-family:'Baloo 2';font-weight:800;font-size:min(8.6vh,5vw);line-height:1;color:var(--accent);
    text-align:center;font-variant-numeric:tabular-nums;}
  .court-card .ready-note{font-family:'Baloo 2';font-weight:800;font-size:min(4vh,2.3vw);line-height:1;color:var(--info);text-align:center;}
  .court-card .free-label{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;
    font-size:min(6vh,3.4vw);color:var(--muted);}

  .center-col{display:flex;flex-direction:column;min-height:0;min-width:0;}
  .center-title{font-family:'Baloo 2';font-weight:800;font-size:min(4.4vh,2.5vw);text-align:center;line-height:1;
    color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin-bottom:1.4vh;}
  .next-list{flex:1;display:grid;grid-template-rows:repeat(6,1fr);gap:1.4vh;min-height:0;}
  .next-item{background:var(--surface);border:.2vh solid var(--border);border-left:1vh solid var(--info);
    border-radius:1.6vh;padding:0 1.2vw;box-shadow:var(--shadow);display:flex;align-items:center;gap:1.2vw;
    min-height:0;min-width:0;overflow:hidden;}
  .next-item.b-fun{border-left-color:var(--warning);}
  .next-item.b-competitive{border-left-color:var(--danger);}
  .next-item.empty{border-style:dashed;border-left-style:dashed;box-shadow:none;background:transparent;opacity:.45;}
  .next-item .pos{font-family:'Baloo 2';font-weight:800;font-size:min(6vh,3.4vw);color:var(--accent);width:3.2vw;text-align:center;flex-shrink:0;}
  .next-item .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .next-item .tline{font-family:'Baloo 2';font-weight:800;font-size:min(4.1vh,2.3vw);line-height:1.12;white-space:nowrap;overflow:hidden;}
  .next-item .tline.b{color:var(--muted);}
  .next-item .tline.b span{color:var(--accent);font-size:.7em;letter-spacing:.15em;margin-right:.5em;}
  .next-item .empty-text{font-family:'Baloo 2';font-weight:700;font-size:min(3.6vh,2vw);color:var(--muted);}

  /* Popups */
  .tv-overlay{position:fixed;inset:0;background:rgba(4,15,22,.86);display:none;align-items:center;justify-content:center;z-index:80;}
  .tv-overlay.show{display:flex;}
  .tv-popup{background:var(--surface);border-radius:28px;padding:clamp(30px,4vw,60px) clamp(40px,6vw,90px);
    text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6);border:3px solid var(--accent);max-width:90vw;}
  .tv-popup.winner{border-color:var(--success);}
  .tv-popup .kicker{font-family:'Baloo 2';font-weight:800;font-size:min(5vh,3vw);color:var(--accent);
    text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
  .tv-popup.winner .kicker{color:var(--success);}
  .tv-popup .court-big{font-size:min(4.6vh,2.8vw);color:var(--muted);margin-bottom:18px;font-weight:600;}
  .tv-popup .teams-big{font-family:'Baloo 2';font-weight:800;font-size:min(8.5vh,5.4vw);line-height:1.25;}
  .tv-popup .score-big{font-family:'Baloo 2';font-weight:800;font-size:min(13vh,8vw);color:var(--accent);margin-top:14px;}
  .tv-popup .winner-name{font-family:'Baloo 2';font-weight:800;font-size:min(10vh,6vw);color:var(--success);margin-top:6px;}

  @media (max-width: 900px){ html,body{height:auto;} body{overflow:auto;} main{grid-template-columns:1fr;} }
</style>
</head>

  <div class="theme-picker" id="themePicker" aria-label="Color theme">
    <button class="theme-btn logo" data-theme-value="logo-green" title="Logo green"></button>
    <button class="theme-btn pink-light" data-theme-value="pink-light" title="Light pink"></button>
    <button class="theme-btn pink-dark" data-theme-value="pink-dark" title="Dark pink"></button>
  </div>
</header>

<main>
  <div class="col courts" id="colLeft">
    <div class="court-card" id="court-1"></div>
    <div class="court-card" id="court-2"></div>
  </div>

  <div class="col center-col">
    <div class="center-title">Up Next</div>
    <div class="next-list" id="nextList"></div>
  </div>

  <div class="col courts" id="colRight">
    <div class="court-card" id="court-3"></div>
    <div class="court-card" id="court-4"></div>
  </div>
</main>

<div class="tv-overlay" id="callOverlay">
  <div class="tv-popup" id="callPopup">
    <div class="kicker">📣 Calling players</div>
    <div class="court-big" id="callCourt"></div>
    <div class="teams-big" id="callTeams"></div>
  </div>
</div>

<div class="tv-overlay" id="winnerOverlay">
  <div class="tv-popup winner" id="winnerPopup">
    <div class="kicker">🏆 Match result</div>
    <div class="court-big" id="winnerCourt"></div>
    <div class="teams-big" id="winnerTeams"></div>
    <div class="score-big" id="winnerScore"></div>
    <div class="winner-name" id="winnerName"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBv_s3wzr6nbFcqZbTI0UDdcijFWnO-t4I",
  authDomain: "ccpc-dupr.firebaseapp.com",
  databaseURL: "https://ccpc-dupr-default-rtdb.firebaseio.com",
  projectId: "ccpc-dupr",
  storageBucket: "ccpc-dupr.firebasestorage.app",
  messagingSenderId: "49883771837",
  appId: "1:49883771837:web:ca4be96157a62afbc858d4",
  measurementId: "G-9D46L85X2T"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COURTS = 4;
const BUCKET_LABELS = { singles:'Singles', fun:'Fun Mode', competitive:'Competitive' };

/* Theme */
const html = document.documentElement;
const themePicker = document.getElementById('themePicker');
const themeButtons = [...themePicker.querySelectorAll('.theme-btn')];

function applyTheme(t){
  const theme = ['logo-green','pink-light','pink-dark'].includes(t) ? t : 'logo-green';
  html.setAttribute('data-theme', theme);
  themeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.themeValue === theme));
  localStorage.setItem('ccpc-tv-theme', theme);
}

applyTheme(localStorage.getItem('ccpc-tv-theme') || 'logo-green');

themeButtons.forEach(btn => {
  btn.addEventListener('click', () => applyTheme(btn.dataset.themeValue));
});

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let queueMatches = [];

db.collection('ccpc-queue-matches').onSnapshot(snap => {
  queueMatches = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderCourts();
  renderNextList();
}, err => console.error(err));

function playersHtml(team){ return team.map(p=>`<div class="p fit">${escapeHtml(p.name)}</div>`).join(''); }

function renderCourts(){
  const occupying = queueMatches.filter(m => m.status==='assigned' || m.status==='playing');
  for (let c=1;c<=COURTS;c++){
    const el = document.getElementById('court-'+c);
    const m = occupying.find(x => x.court === c);
    if (!m) {
      el.className = 'court-card';
      el.innerHTML = `
        <div class="court-num">Court ${c}<span class="court-status-pill free">Available</span></div>
        <div class="free-label">Open court</div>`;
      continue;
    }
    const body = `
      <div class="players">
        ${playersHtml(m.team1)}
        <div class="vs">VS</div>
        ${playersHtml(m.team2)}
      </div>`;
    if (m.status === 'playing'){
      el.className = 'court-card playing';
      el.innerHTML = `
        <div class="court-num">Court ${c}<span class="court-status-pill playing">Playing</span></div>
        ${body}
        <div class="timer" data-started="${m.startedAt}">00:00</div>`;
    } else {
      el.className = 'court-card assigned';
      el.innerHTML = `
        <div class="court-num">Court ${c}<span class="court-status-pill assigned">Getting ready</span></div>
        ${body}
        <div class="ready-note">Please proceed to the court</div>`;
    }
  }
  updateTimers();
  fitAll();
}
function updateTimers(){
  document.querySelectorAll('.timer').forEach(el => {
    const started = Number(el.dataset.started);
    if (!started) return;
    const secs = Math.max(0, Math.floor((Date.now() - started) / 1000));
    el.textContent = `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
  });
}
setInterval(updateTimers, 1000);

const NEXT_SLOTS = 6;
function renderNextList(){
  const list = queueMatches.filter(m => m.status === 'waiting').sort((a,b) => a.order - b.order).slice(0, NEXT_SLOTS);
  const el = document.getElementById('nextList');
  let html = '';
  for (let i=0;i<NEXT_SLOTS;i++){
    const m = list[i];
    if (!m) {
      html += `<div class="next-item empty"><div class="pos">${i+1}</div><div class="info"><div class="empty-text">—</div></div></div>`;
      continue;
    }
    html += `
    <div class="next-item b-${m.bucket}">
      <div class="pos">${i+1}</div>
      <div class="info">
        <div class="tline fit">${escapeHtml(m.team1.map(p=>p.name).join(' & '))}</div>
        <div class="tline b fit"><span>VS</span>${escapeHtml(m.team2.map(p=>p.name).join(' & '))}</div>
      </div>
    </div>`;
  }
  el.innerHTML = html;
  fitAll();
}

/* shrink text only when a name would overflow its line, so long names stay fully visible */
function fitAll(){
  requestAnimationFrame(() => {
    document.querySelectorAll('.fit').forEach(el => {
      el.style.fontSize = '';
      let size = parseFloat(getComputedStyle(el).fontSize);
      let guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && size > 14 && guard < 120) {
        size -= 1; el.style.fontSize = size + 'px'; guard++;
      }
    });
  });
}
window.addEventListener('resize', fitAll);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

/* TV events: call players / winner popups */
let eventsInitialized = false;
let lastEventId = null;
db.collection('ccpc-queue-events').orderBy('createdAt','desc').limit(1).onSnapshot(snap => {
  if (snap.empty) { eventsInitialized = true; return; }
  const doc = snap.docs[0];
  const data = doc.data();
  if (!data.createdAt) return; // still-pending serverTimestamp write; wait for the confirmed snapshot
  if (!eventsInitialized) { eventsInitialized = true; lastEventId = doc.id; return; }
  if (doc.id === lastEventId) return;
  lastEventId = doc.id;
  const ageMs = Date.now() - data.createdAt.toMillis();
  if (ageMs > 15000) return;
  if (data.type === 'call') showCallPopup(data);
  else if (data.type === 'winner') showWinnerPopup(data);
}, err => console.error(err));

function showCallPopup(data){
  const t1 = data.team1.join(' & ');
  const t2 = data.team2.join(' & ');
  document.getElementById('callCourt').textContent = `Court ${data.court}`;
  document.getElementById('callTeams').innerHTML = `${escapeHtml(t1)}<br><span style="color:var(--muted);font-size:.6em;">vs</span><br>${escapeHtml(t2)}`;
  const ov = document.getElementById('callOverlay');
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 5000);
}
function showWinnerPopup(data){
  const t1 = data.team1.join(' & ');
  const t2 = data.team2.join(' & ');
  const winnerNames = data.winner === 'team1' ? t1 : t2;
  document.getElementById('winnerCourt').textContent = `Court ${data.court}`;
  document.getElementById('winnerTeams').innerHTML = `${escapeHtml(t1)} <span style="color:var(--muted);font-size:.5em;">vs</span> ${escapeHtml(t2)}`;
  document.getElementById('winnerScore').textContent = `${data.score1} – ${data.score2}`;
  document.getElementById('winnerName').textContent = winnerNames;
  const ov = document.getElementById('winnerOverlay');
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 5000);
}

renderCourts();
renderNextList();
</script>
</body>
</html>
